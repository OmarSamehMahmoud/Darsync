# GitHub Pages deployment for the Darsync frontend.
name: Deploy Darsync to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - migration/github-pages-supabase
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: darsync-production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
